on:
  workflow_call:
    inputs:
      otp-version:
        description: "Latest supported OTP version to test"
        required: false
        default: "28.0"
        type: string
      rebar3-version:
        description: "Rebar3 version to install"
        required: false
        default: "3.25.1"
        type: string

name: "Test"

permissions:
  contents: read

jobs:
  format:
    name: Check Formatting

    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@df199fb7be9f65074067a9eb93f12bb4c5547cf2 # v2.13.3
        with:
          egress-policy: audit
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: ./.github/actions/setup-runtime-env

      - run: rebar3 fmt --check

  ct:
    name: rebar3 CT (${{ matrix.name }})

    runs-on: ${{ matrix.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest Supported
          - otp: "27.0"
            name: "lowest"
            runs-on: ubuntu-latest
            unstable: false
          # Latest Supported
          - otp: "${{ inputs.otp-version }}"
            name: "latest"
            runs-on: ubuntu-latest
            unstable: false
          # Test Main
          - otp: "${{ inputs.otp-version }}"
            name: "main"
            runs-on: ubuntu-latest
            unstable: true

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@df199fb7be9f65074067a9eb93f12bb4c5547cf2 # v2.13.3
        with:
          egress-policy: audit
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: ./.github/actions/setup-runtime-env
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: ${{ inputs.rebar3-version }}

      - name: "Install Test OS Dependencies"
        run: |
          BREW_BIN="/home/linuxbrew/.linuxbrew/bin"
          "$BREW_BIN/brew" tap cyclonedx/cyclonedx
          "$BREW_BIN/brew" install cyclonedx/cyclonedx/cyclonedx-cli

      - name: "Run CT Suites"
        run: |
          export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          rebar3 ct --cover

      - name: "Create HTML Coverage Report"
        run: rebar3 cover

      - name: "Convert Coverage to Cobertura XML"
        run: rebar3 covertool generate

      - name: Send Coverage to Coveralls
        if: always()
        uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e # v2.3.7
        with:
          file: "_build/test/covertool/rebar_sbom.covertool.xml"
          format: cobertura
          flag-name: ct-${{ matrix.name }}
          parallel: true

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: coverage-ct-${{ matrix.name }}
          path: "_build/test/cover/*"

  finish_coverage:
    name: Finish Coveralls Report

    needs: ["ct"]

    if: ${{ always() }}

    runs-on: ubuntu-latest

    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e # v2.3.7
      with:
        parallel-finished: true
        carryforward: "ct-lowest,ct-latest,ct-main"

  lint:
    name: "Elvis Linter"

    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@df199fb7be9f65074067a9eb93f12bb4c5547cf2 # v2.13.3
        with:
          egress-policy: audit
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: ./.github/actions/setup-runtime-env

      - run: rebar3 lint

  dialyzer:
    name: "Check Dialyzer"

    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@df199fb7be9f65074067a9eb93f12bb4c5547cf2 # v2.13.3
        with:
          egress-policy: audit
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: ./.github/actions/setup-runtime-env

      - run: rebar3 dialyzer
